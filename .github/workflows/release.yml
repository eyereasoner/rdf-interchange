name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release message is the tag's; ./release gives the commit the same.
      - name: Get short message
        id: msg
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          short=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}")
          echo "short=${short:-$(git log -1 --pretty=%s ${{ github.sha }})}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --title "${{ github.ref_name }} — ${{ steps.msg.outputs.short }}" \
            --generate-notes \
            --notes "${{ steps.msg.outputs.short }}"
